name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: true
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
        django-version:
          - "5.2"  # LTS
          - "6.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: '**/pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install uv

      - name: Install Django ${{ matrix.django-version }}
        run: |
          python -m uv pip install --system "Django~=${{ matrix.django-version }}.0"

      - name: Install dependencies
        run: |
          python -m uv pip install --system -e ".[test]"

      - run: |
          pytest .

  # Django 6.1 readiness, advisory only (continue-on-error).
  #
  # Django 6.1 removed django.utils.cache.cc_delim_re, which every released
  # Django REST Framework (<=3.17.1) still imports. Wagtail depends on DRF for
  # wagtail.api, so 6.1 fails at import against a released DRF — nothing we can
  # fix here. DRF merged the fix in encode/django-rest-framework#9978 but has
  # not cut a release, so this job installs DRF from main to exercise our own
  # 6.1 compatibility rather than sitting red on someone else's release
  # schedule.
  #
  # When DRF ships a fixed release: drop the git install below, delete the 6.1
  # skip in noxfile.py, and promote 6.1 into the matrix above.
  test-django-61:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYTHONDONTWRITEBYTECODE: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: '**/pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install uv

      - name: Install Django 6.1
        run: |
          python -m uv pip install --system "Django>=6.1rc1,<6.2"

      - name: Install dependencies
        run: |
          python -m uv pip install --system -e ".[test]"

      - name: Install Django REST Framework from main (unreleased 6.1 fix)
        run: |
          python -m uv pip install --system \
            "djangorestframework @ git+https://github.com/encode/django-rest-framework@main"

      - run: |
          pytest .
